<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Class One</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <div class="login-container">

    <div class="login-box">

      <a href="index.html" class="login-logo">
        <img src="class-one-logo.png" alt="Class One Logo">
      </a>

      <div class="login-heading">
        <div class="about-label">WELCOME BACK</div>
        <h1>Login to <span>Class One</span></h1>
        <p>Access your Class One account.</p>
      </div>

      <form class="login-form">

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <div class="login-options">
          <label class="remember">
            <input type="checkbox">
            Remember me
          </label>

          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Login →</button>

      </form>

      <div class="signup-text">
        Don't have an account?
        <a href="signup.html">Create Account</a>
      </div>

      <a href="index.html" class="back-home">
        ← Back to Class One
      </a>

    </div>

  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  // Use the SAME Firebase configuration
  // that you used in signup.html
  const firebaseConfig = {
    apiKey: "AIzaSyAQBRnfmZIP_Ahk0WiyoKqf87NTaggt4vI",
    authDomain: "class-one-263aa.firebaseapp.com",
    projectId: "class-one-263aa",
    storageBucket: "class-one-263aa.firebasestorage.app",
    messagingSenderId: "534348284001",
    appId: "1:534348284001:web:1730328fec2eb21bc3ea20"
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.querySelector(".login-form");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await setPersistence(auth, browserLocalPersistence);
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      

      window.location.href = "login.html";

    } catch (error) {

      if (error.code === "auth/invalid-credential") {
        alert("Incorrect email or password.");
      }

      else if (error.code === "auth/invalid-email") {
        alert("Please enter a valid email address.");
      }

      else {
        alert(error.message);
      }

    }
  });
</script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
