<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Class One</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <div class="login-container">

    <div class="login-box signup-box">

      <a href="index.html" class="login-logo">
        <img src="class-one-logo.png" alt="Class One Logo">
      </a>

      <div class="login-heading">
        <div class="about-label">JOIN CLASS ONE</div>
        <h1>Create <span>Account</span></h1>
        <p>Create your account to get started.</p>
      </div>

      <form class="login-form" id="login-form">

        <label for="fullname">Full Name</label>
        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          required
        >

        <label for="signup-email">Email Address</label>
        <input
          type="email"
          id="signup-email"
          placeholder="Enter your email"
          required
        >

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter your phone number"
        >

        <label for="signup-password">Password</label>
        <input
          type="password"
          id="signup-password"
          placeholder="Create a password"
          required
        >

        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          placeholder="Confirm your password"
          required
        >

        <label class="remember">
          <input type="checkbox" required>
          I agree to the terms and conditions
        </label>

        <button type="submit">Create Account →</button>

      </form>

      <div class="signup-text">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

      <a href="index.html" class="back-home">
        ← Back to Class One
      </a>

    </div>

  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAQBRnfmZIP_Ahk0WiyoKqf87NTaggt4vI",
    authDomain: "class-one-263aa.firebaseapp.com",
    projectId: "class-one-263aa",
    storageBucket: "class-one-263aa.firebasestorage.app",
    messagingSenderId: "534348284001",
    appId: "1:534348284001:web:1730328fec2eb21bc3ea20"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.querySelector(".login-form");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("fullname").value;
    const email = document.getElementById("signup-email").value;
    const password = document.getElementById("signup-password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    if (password !== confirmPassword) {
      alert("Passwords do not match.");
      return;
    }

    try {
      const userCredential =
        await createUserWithEmailAndPassword(auth, email, password);

      await updateProfile(userCredential.user, {
        displayName: name
      });

      alert("Account created successfully!");

      window.location.href = "login.html";

    } catch (error) {
      alert(error.message);
    }
  });
</script>

<script type="module" src="js/app.js"></script>

</body>
</html>
